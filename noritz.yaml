# Board: NodeMCU v2 (ESP8266) (NodeMCU)
# Definition: definitions/boards/nodemcuv2/manifest.yaml

esphome:
  name: noritz-controller
  friendly_name: noritz_controller

esp8266:
  board: nodemcuv2

logger:

api:
  encryption:
    key: "e9qLgtA86J/z/4bHmMpv0/4i+T+DAbSWwEri+38UxQg="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: noritz_controll Fallback Hotspot
    password: !secret wifi_password

captive_portal:

external_components:
  - source:
      type: local
      path: components

uart:
  id: noritz_uart
  rx_pin: GPIO4
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256


# =========================
# Web 管理页面
# =========================
web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password  
  
sensor:
  - platform: noritz
    uart_id: noritz_uart
    power:
      name: "Noritz Power State"
      id: noritz_power_state
    temperature:
      name: "Noritz Temperature"
      id: noritz_set_temperature

binary_sensor:
  - platform: template
    name: "Noritz Power"
    lambda: |-
      if (isnan(id(noritz_power_state).state))
        return {};
      return id(noritz_power_state).state > 0.5f;


switch:
  - platform: gpio
    name: "Noritz Temperature Up Output"
    id: noritz_up
    internal: true
    pin:
      number: GPIO12  # D6
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: noritz_up

  - platform: gpio
    name: "Noritz Temperature Down Output"
    id: noritz_down
    internal: true
    pin:
      number: GPIO13  # D7
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: noritz_down

  - platform: gpio
    name: "Noritz Power Button Output"
    id: noritz_power_button
    internal: true
    pin:
      number: GPIO14  # D5
      inverted: false
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 500ms
      - switch.turn_off: noritz_power_button

button:
  - platform: template
    name: "Temperature Up"
    on_press:
      - switch.turn_on: noritz_up

  - platform: template
    name: "Temperature Down"
    on_press:
      - switch.turn_on: noritz_down

  - platform: template
    name: "Power"
    on_press:
      - switch.turn_on: noritz_power_button
